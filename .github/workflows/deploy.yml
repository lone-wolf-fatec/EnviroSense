name: Deploy Manual
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão do deploy (ex: 1.0, 1.1)'
        required: true
        default: '1.0'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar branch de deploy
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b deploy/v${{ github.event.inputs.versao }}
          git push origin deploy/v${{ github.event.inputs.versao }} --force

      - name: Instalar dependências frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy no Azure
        run: |
          cd frontend
          zip -r ../app.zip dist/
          cd ..
          USERNAME=$(echo '${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}' | grep -oP 'userName="\K[^"]+' | head -1)
          PASSWORD=$(echo '${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}' | grep -oP 'userPWD="\K[^"]+' | head -1)
          curl -X POST \
            "https://envirosense-api-fnaqcgh2gaf4fhcg.scm.azurewebsites.net/api/zipdeploy" \
            -u "$USERNAME:$PASSWORD" \
            --data-binary @app.zip \
            --fail
