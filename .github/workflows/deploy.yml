name: Deploy Manual

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão do deploy (ex: 1.0, 1.1)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy para Azure
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build do frontend
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: |
          npm ci
          npm run build

      - name: Instalar dependências do backend (produção)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Criar tag de versão
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f "v${{ github.event.inputs.versao }}"
          git push origin "v${{ github.event.inputs.versao }}" --force

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Empacotar aplicação (backend + frontend/dist)
        run: |
          mkdir -p deploy_package
          cp -r backend/* deploy_package/
          cp -r backend/.[!.]* deploy_package/ 2>/dev/null || true
          mkdir -p deploy_package/frontend
          cp -r frontend/dist deploy_package/frontend/dist
          cd deploy_package
          zip -r ../app.zip . -x "node_modules/.cache/*"

      - name: Deploy no Azure
        run: |
          az webapp deploy \
            --name envirosense-app \
            --resource-group envirosense-rg \
            --src-path app.zip \
            --type zip

      - name: Configurar comando de inicialização
        run: |
          az webapp config set \
            --name envirosense-app \
            --resource-group envirosense-rg \
            --startup-file "node server.js"

      - name: Logout do Azure
        if: always()
        run: az logout